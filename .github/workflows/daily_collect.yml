name: Daily Collect and Analyze

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vp-vs-digest-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check pending publication
        id: pending
        run: python scripts/build_daily_telegram_post.py

      - name: Run daily pipeline
        id: pipeline
        if: steps.pending.outputs.has_pending != 'true'
        run: |
          python scripts/fetch_dataset.py
          python scripts/prepare_analysis_pool.py
          python scripts/analyze_with_gemini.py
          python scripts/build_daily_telegram_post.py

      - name: Save analyses before publication
        id: save_analysis
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/processed/analysis/ data/state/
          if ! git diff --cached --quiet; then
            git commit -m "Save VP digest analyses [skip ci]"
            git push
          fi

      - name: Send to Telegram
        id: publish
        run: python scripts/send_to_telegram.py

      - name: Save publication state
        if: ${{ !cancelled() && steps.save_analysis.outcome == 'success' && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        shell: bash
        run: |
          git add -- data/state/posted_doc_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram publication state [skip ci]"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vp-vs-digest-daily-${{ github.run_id }}
          path: |
            data/interim/
            data/state/
            outputs/digest/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload recovery analyses
        if: ${{ failure() && (steps.pipeline.outcome == 'failure' || steps.save_analysis.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: vp-vs-digest-recovery-${{ github.run_id }}
          path: |
            data/processed/analysis/
            data/state/
          if-no-files-found: warn
          retention-days: 7
